name: verified evidence

on:
  push:
    branches: [main, codex/verified-memory-engine]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record source and environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          python3 --version > "$RUNNER_TEMP/evidence/python.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/evidence/source.tar"
      - name: Replay frozen pre-upgrade baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive v0.4.0 | tar -x -C "$RUNNER_TEMP/baseline"
          cd "$RUNNER_TEMP/baseline"
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/evidence/baseline-tests.txt"
          python3 benchmarks/evaluate.py --out "$RUNNER_TEMP/evidence/baseline-benchmark"
      - name: Run candidate tests
        shell: bash
        run: python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/evidence/candidate-tests.txt"
      - name: Replay candidate benchmark twice
        shell: bash
        run: |
          python3 benchmarks/evaluate.py --out "$RUNNER_TEMP/evidence/candidate-benchmark"
          python3 benchmarks/evaluate.py --out "$RUNNER_TEMP/evidence/repeated-benchmark"
          diff -r "$RUNNER_TEMP/evidence/candidate-benchmark" "$RUNNER_TEMP/evidence/repeated-benchmark"
          diff -r "$RUNNER_TEMP/evidence/baseline-benchmark" "$RUNNER_TEMP/evidence/candidate-benchmark"
          python3 benchmarks/wiki/evaluate.py --out "$RUNNER_TEMP/evidence/wiki-benchmark"
          python3 benchmarks/wiki/evaluate.py --out "$RUNNER_TEMP/evidence/wiki-repeat"
          diff -r "$RUNNER_TEMP/evidence/wiki-benchmark" "$RUNNER_TEMP/evidence/wiki-repeat"
          cmp benchmarks/wiki/results.json "$RUNNER_TEMP/evidence/wiki-benchmark/results.json"
          python3 benchmarks/gateway/evaluate.py --out "$RUNNER_TEMP/evidence/gateway-benchmark"
          python3 benchmarks/gateway/evaluate.py --out "$RUNNER_TEMP/evidence/gateway-repeat"
          diff -r "$RUNNER_TEMP/evidence/gateway-benchmark" "$RUNNER_TEMP/evidence/gateway-repeat"
          python3 tools/verify_gateway_delta.py --baseline benchmarks/gateway/results.json --candidate "$RUNNER_TEMP/evidence/gateway-benchmark/results.json" --out "$RUNNER_TEMP/evidence/gateway-contract-delta.json"
      - name: Verify wheel outside source checkout
        shell: bash
        run: |
          python3 -m pip install "setuptools>=61" wheel
          python3 -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" 2>&1 | tee "$RUNNER_TEMP/evidence/wheel-build.txt"
          python3 -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/wheels/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/verify_install.py" | tee "$RUNNER_TEMP/evidence/installed-smoke.json"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/verify_wiki.py" | tee "$RUNNER_TEMP/evidence/installed-wiki.json"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/verify_gateway.py" | tee "$RUNNER_TEMP/evidence/installed-gateway.json"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/verify_skill.py" | tee "$RUNNER_TEMP/evidence/installed-skill.json"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/wiki_demo.py" --out "$RUNNER_TEMP/evidence/wiki-demo" > "$RUNNER_TEMP/evidence/wiki-demo.json"
          PATH="$RUNNER_TEMP/installed/bin:$PATH" "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/verify_docs.py" | tee "$RUNNER_TEMP/evidence/docs-smoke.json"
      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
