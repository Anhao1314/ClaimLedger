<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimLedger · 决定台账</title>
<meta name="description" content="一台 Agent 记下的决定，下一台 Agent 接着用。冲突拒写、争议摊开、过期不冒充现状——全部本地，零模型调用。">
<link rel="icon" type="image/svg+xml" href="/static/mark.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="first-paint">

<header class="topbar">
  <div class="topbar__brand">
    <img src="/static/mark.svg" alt="" class="topbar__mark">
    <div class="topbar__title">
      <strong id="scenarioName">Atlas API</strong>
      <span class="topbar__sub" id="scenarioKicker">synthetic project</span>
    </div>
  </div>
  <div class="topbar__tools">
    <label class="when" id="whenBox">
      <span class="when__label" id="whenLabel">时间</span>
      <select id="whenSelect" class="when__select">
        <option value="">现在</option>
        <option value="2026-09-30T00:00:00Z">9 月底 · SQLite 时代</option>
        <option value="__date">选一个日期…</option>
      </select>
      <input type="date" id="whenDate" class="when__date" hidden>
    </label>
    <button class="lang" id="langBtn" type="button" aria-label="switch language">EN</button>
  </div>
</header>

<main class="page" id="main">
  <p class="lede" id="lede">周五在豆包定下的方案，周一的 Codex 接着干。这个页面就是两台 Agent 之间那份「什么才算数」。</p>

  <section class="budget" id="budgetBar" aria-label="brief budget">
    <div class="budget__main">
      <span class="budget__name" id="budgetName">开工简报</span>
      <span class="budget__nums"><b id="budgetUsed">0</b> / <span id="budgetMax">2048</span> B</span>
      <span class="budget__omit" id="budgetOmit" hidden></span>
    </div>
    <div class="budget__bar"><i id="budgetFill"></i></div>
    <input type="range" id="budgetRange" min="512" max="8192" step="256" value="2048"
           aria-label="byte budget">
  </section>

  <section class="timeline" id="timeline" aria-live="polite">
    <div class="tl-section tl-section--current" id="secCurrent">
      <h2 class="tl-head"><i class="dot dot--current"></i><span id="currentTitle">现在什么算数</span>
        <span class="tl-count" id="currentCount">0</span></h2>
      <ol class="tl-list" id="listCurrent"></ol>
    </div>
    <div class="tl-section tl-section--attention" id="secAttention" hidden>
      <h2 class="tl-head"><i class="dot dot--attention"></i><span id="attentionTitle">需要你</span>
        <span class="tl-count" id="attentionCount">0</span></h2>
      <ol class="tl-list" id="listAttention"></ol>
    </div>
    <div class="tl-section tl-section--past" id="secPast">
      <button class="tl-head tl-head--toggle" id="pastToggle" type="button">
        <i class="dot dot--past"></i><span id="pastTitle">已替代</span>
        <span class="tl-count" id="pastCount">0</span><span class="tl-chev" id="pastChev">▸</span>
      </button>
      <ol class="tl-list" id="listPast" hidden></ol>
    </div>
    <p class="timeline-empty" id="timelineEmpty" hidden></p>
  </section>

  <div class="conflict" id="conflictCard" hidden>
    <h3 class="conflict__title" id="conflictTitle">这条和现行决定撞上了</h3>
    <p class="conflict__hint" id="conflictHint">台账不悄悄改写历史。你来定：新的替代旧的，还是先记为有争议？</p>
    <ul class="conflict__list" id="conflictList"></ul>
    <div class="conflict__actions">
      <button class="btn btn--primary" id="conflictSupersede" type="button">替代旧的</button>
      <button class="btn" id="conflictDispute" type="button">记为有争议</button>
      <button class="btn btn--ghost" id="conflictCancel" type="button">取消</button>
    </div>
  </div>

  <div class="composer" id="composer">
    <div class="composer__shell">
      <div class="composer__chips">
        <input id="fTopic" class="chip-input" value="general" maxlength="40"
               pattern="[a-z0-9][a-z0-9-]{0,39}" aria-label="topic">
        <div class="examples" id="examples"></div>
      </div>
      <div class="composer__row">
        <textarea id="fText" rows="1" placeholder="记一条决定…" maxlength="1000"></textarea>
        <button class="send" id="recordBtn" type="button" title="记录" aria-label="记录">↑</button>
      </div>
    </div>
    <p class="composer__note"><span id="composerNote">写入真实的 JSONL 台账 · 冲突会被拒绝并摊开</span>
      <button class="example" id="previewBtn" type="button"></button></p>
  </div>
</main>

<footer class="foot">
  <button class="foot__link" id="devToggle" type="button">开发者视图 ▾</button>
  <span class="foot__meta" id="footMeta"></span>
</footer>

<section class="dev" id="devDrawer" hidden>
  <nav class="dev__tabs" id="devTabs">
    <button class="dev__tab is-on" data-dev="search" type="button">检索</button>
    <button class="dev__tab" data-dev="context" type="button">Context / RAG</button>
    <button class="dev__tab" data-dev="brief" type="button">原始简报</button>
    <button class="dev__tab" data-dev="evidence" type="button">证据</button>
    <button class="dev__tab" data-dev="safety" type="button">安全</button>
  </nav>

  <div class="dev__panel" id="dev-search">
    <div class="dev__row">
      <input id="devQ" class="dev__input" placeholder="use sqlite">
      <label class="dev__check"><input type="checkbox" id="devRaw"> <span id="devRawLabel">关掉状态过滤（模拟把历史喂回去）</span></label>
      <button class="btn" id="devSearchBtn" type="button">检索</button>
    </div>
    <div class="dev__out" id="devSearchOut"></div>
  </div>

  <div class="dev__panel" id="dev-context" hidden>
    <div class="dev__row">
      <input id="devCtxQ" class="dev__input" value="use sqlite">
      <select id="devCtxIntent" class="dev__input dev__input--s">
        <option value="current">current</option>
        <option value="historical">historical</option>
      </select>
      <button class="btn" id="devCtxBtn" type="button">构建证据包</button>
    </div>
    <div class="dev__out" id="devCtxOut"></div>
  </div>

  <div class="dev__panel" id="dev-brief" hidden>
    <div class="dev__row">
      <button class="btn" id="devBriefBtn" type="button">重新渲染</button>
      <span class="dev__hint">brief 的每个字节都可验证；wire 与 CLI 输出逐字一致</span>
    </div>
    <div class="dev__out"><pre id="devBriefWire" class="mono"></pre></div>
  </div>

  <div class="dev__panel" id="dev-evidence" hidden>
    <div class="dev__out" id="devEvidenceOut"></div>
  </div>

  <div class="dev__panel" id="dev-safety" hidden>
    <div class="dev__row">
      <input id="devRedactId" class="dev__input mono" placeholder="clm_…">
      <button class="btn" id="devRedactBtn" type="button">脱敏（保留墓碑）</button>
      <button class="btn" id="devBackupBtn" type="button">备份</button>
      <button class="btn" id="devAuditBtn" type="button">审计</button>
      <button class="btn btn--danger" id="devResetBtn" type="button">重置演示</button>
    </div>
    <div class="dev__out" id="devSafetyOut"></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
